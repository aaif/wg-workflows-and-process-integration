  - { id: WP03, name: Model-Selected Deterministic Branch, status: proposal }
  - { id: WP04, name: Generate-Validate-Repair, status: proposal }
  - { id: WP05, name: Bounded Plan + Deterministic Execute, status: proposal }
  - { id: WP06, name: Model-Assisted Exception Handling, status: proposal }
  - { id: WP07, name: Human-Supervised Action, status: mature }
  - { id: WP08, name: Durable Workflow Envelope, status: mature }
  - { id: WP09, name: Bounded Agentic Region, status: proposal }
  - { id: WP10, name: Multi-Agent Delegation, status: proposal }
  - { id: WP11, name: Cross-Runtime Handoff, status: proposal }

