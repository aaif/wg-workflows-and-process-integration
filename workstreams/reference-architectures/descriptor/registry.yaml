  - { id: AP-07, name: Context as record }
  - { id: AP-08, name: Unbounded plan }
  - { id: AP-09, name: Open generation where a closed set exists }
  - { id: AP-10, name: Missing terminal outcome }
  - { id: AP-11, name: Effect ceiling ignored }
  - { id: AP-12, name: Cross-WG fork }
  - { id: AP-13, name: Hidden model in a service }
  - { id: AP-14, name: Durable wait without durability }
  - { id: AP-15, name: Parallel without join }
  - { id: AP-16, name: Unlogged decision }
  - { id: AP-17, name: Uncoded concept }
  - { id: AP-18, name: Approval reused across changes }

